<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HyperFrames Lower Third</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: {{WIDTH}}px;
      height: {{HEIGHT}}px;
      overflow: hidden;
      background: transparent;
      font-family: "Inter", "DejaVu Sans", system-ui, sans-serif;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .card {
      position: absolute;
      left: 7%;
      bottom: 18%;
      display: flex;
      align-items: stretch;
      background: rgba(9, 11, 18, 0.88);
      border: 2px solid {{ACCENT}};
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
      animation: slideIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .bar {
      width: 12px;
      background: {{ACCENT}};
    }
    .content {
      padding: 18px 28px;
    }
    .name {
      font-size: calc({{WIDTH}}px * 0.038);
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
    }
    .role {
      margin-top: 4px;
      font-size: calc({{WIDTH}}px * 0.025);
      font-weight: 600;
      color: {{ACCENT}};
      letter-spacing: 0.03em;
    }
    @keyframes slideIn {
      from { transform: translateX(-60px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="lower-third" data-start="0" data-duration="{{DURATION}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-fps="{{FPS}}">
    <div class="clip card" data-start="0" data-duration="{{DURATION}}" data-track-index="0">
      <div class="bar"></div>
      <div class="content">
        <div class="name">{{TITLE}}</div>
        <div class="role">{{SUBTITLE}}</div>
      </div>
    </div>
  </div>
</body>
</html>
