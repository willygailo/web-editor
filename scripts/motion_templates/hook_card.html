<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HyperFrames Hook Intro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: {{WIDTH}}px;
      height: {{HEIGHT}}px;
      overflow: hidden;
      background: #090b12;
      font-family: "Inter", "DejaVu Sans", system-ui, sans-serif;
      color: #ffffff;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10%;
      background:
        radial-gradient(circle at 20% 20%, {{ACCENT}}33 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, #22d3ee28 0%, transparent 50%),
        linear-gradient(145deg, #090b12 0%, #111827 100%);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 26px;
      border-radius: 999px;
      background: {{ACCENT}};
      color: #090b12;
      font-weight: 800;
      font-size: calc({{WIDTH}}px * 0.032);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
      animation: popIn 0.45s cubic-bezier(0.2, 1.2, 0.3, 1) forwards;
    }
    .headline {
      text-align: center;
      font-weight: 900;
      font-size: calc({{WIDTH}}px * 0.072);
      line-height: 1.08;
      letter-spacing: -0.02em;
      text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      animation: slideUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }
    .sub {
      margin-top: 24px;
      text-align: center;
      font-size: calc({{WIDTH}}px * 0.036);
      color: #cbd5e1;
      font-weight: 500;
      animation: fadeIn 0.6s ease 0.25s both;
    }
    @keyframes popIn {
      from { transform: scale(0.75); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(42px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="hook-card" data-start="0" data-duration="{{DURATION}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-fps="{{FPS}}">
    <div class="clip badge" data-start="0" data-duration="{{DURATION}}" data-track-index="0">{{BADGE}}</div>
    <h1 class="clip headline" data-start="0" data-duration="{{DURATION}}" data-track-index="1">{{TITLE}}</h1>
    <p class="clip sub" data-start="0.15" data-duration="{{DURATION}}" data-track-index="2">{{SUBTITLE}}</p>
  </div>
</body>
</html>
